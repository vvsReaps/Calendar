<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Moved | ProfitHub</title>
  <meta http-equiv="refresh" content="5;url=https://students.profithub.app/" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(620px, 100%);
      text-align: center;
      padding: 48px 32px;
      border: 1px solid #242424;
      border-radius: 20px;
      background: #0d0d0d;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.8rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 28px;
      color: #b9b9b9;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, opacity .2s ease;
    }

    a:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    .small {
      margin-top: 20px;
      margin-bottom: 0;
      font-size: .9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>This page has moved.</h1>
    <p>
      The ProfitHub student portal is now available at
      <strong>students.profithub.app</strong>.
    </p>
    <a href="https://students.profithub.app/">Go to the new page</a>
    <p class="small">You’ll be redirected automatically in 5 seconds.</p>
  </main>
</body>
</html>
